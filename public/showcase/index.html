<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Quert Alfonso M. Villafuerte - Projects</title>
<link rel="icon" type="image/png" href="/icon.png">
<!-- no-flash theme init: shares localStorage.theme + the .dark class with the main portfolio -->
<script>(function(){try{var s=localStorage.getItem("theme");var d=s?s==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.classList.toggle("dark",d);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- notebook theme tokens (mirrors the main site's globals.css) ---------- */
:root{
  --paper:#f6f5f0; --ink:#17150f;
  --grid-line:rgba(23,21,15,.05); --grid-strong:rgba(23,21,15,.09);
  --margin-line:rgba(23,21,15,.14); --tape:rgba(23,21,15,.08);
}
html.dark{
  --paper:#121110; --ink:#eae8df;
  --grid-line:rgba(234,232,223,.045); --grid-strong:rgba(234,232,223,.08);
  --margin-line:rgba(234,232,223,.13); --tape:rgba(234,232,223,.09);
}
/* derived ink alphas — lazily resolve var(--ink), so they follow the theme */
:root{
  --ink-90:color-mix(in srgb,var(--ink) 90%,transparent);
  --ink-70:color-mix(in srgb,var(--ink) 70%,transparent);
  --ink-60:color-mix(in srgb,var(--ink) 60%,transparent);
  --ink-45:color-mix(in srgb,var(--ink) 45%,transparent);
  --ink-35:color-mix(in srgb,var(--ink) 35%,transparent);
  --ink-30:color-mix(in srgb,var(--ink) 30%,transparent);
  --ink-20:color-mix(in srgb,var(--ink) 20%,transparent);
  --ink-12:color-mix(in srgb,var(--ink) 12%,transparent);
  --ink-06:color-mix(in srgb,var(--ink) 6%,transparent);
  --maxw:1120px;
  --display:"Anton","Arial Narrow",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --hand:"Caveat","Segoe Script",cursive;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{
  background:var(--paper); color:var(--ink);
  font:13.5px/1.62 var(--mono); -webkit-font-smoothing:antialiased;
  transition:background-color .25s ease,color .25s ease;
}
::selection{background:var(--ink); color:var(--paper)}
:focus-visible{outline:2px solid var(--ink); outline-offset:3px}
a{color:inherit}
img,video{max-width:100%}

/* ---------- squared-paper sheet + margin rule ---------- */
.sheet{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:
    linear-gradient(to right, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-strong) 1px, transparent 1px),
    linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
  background-size:104px 104px,130px 130px,26px 26px,26px 26px;
  background-position:78px 0,0 104px,0 0,0 0;
}
.sheet .margin{position:absolute; top:0; bottom:0; width:1px; background:var(--margin-line)}
.sheet .m1{left:38px} .sheet .m2{left:42px; opacity:.6}
@media(min-width:768px){ .sheet .m1{left:64px} .sheet .m2{left:68px} }

/* ---------- spiral binding along the top edge ---------- */
.binding{position:absolute; inset-inline:0; top:10px; z-index:5; display:flex; justify-content:center; gap:17px; overflow:hidden; opacity:.7; pointer-events:none}
.binding span{position:relative; display:block; width:9px; height:9px; flex:0 0 auto; border-radius:50%; border:1px solid var(--ink-30); background:var(--paper)}
.binding span::before{content:""; position:absolute; left:50%; top:-9px; width:1px; height:8px; transform:translateX(-50%); background:var(--ink-20)}

.wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px}
@media(min-width:768px){ .wrap{padding:0 40px} }

/* ---------- top bar (mirrors the main site's Nav) ---------- */
.top{position:relative; z-index:10}
.top .wrap{display:flex; align-items:center; gap:14px; height:74px; padding-top:24px}
.brand{display:inline-flex; align-items:center; gap:7px; background:none; border:0; padding:0; cursor:pointer; color:inherit;
  font-family:var(--mono); font-weight:600; font-size:13px; text-transform:lowercase; letter-spacing:-.01em}
.brand .star{width:12px; height:12px; color:var(--ink-70); transition:transform .3s ease}
.brand:hover .star{transform:rotate(90deg)}
.spacer{flex:1}
.tbtn{display:inline-grid; place-items:center; width:30px; height:30px; border:0; background:none; cursor:pointer; color:var(--ink-60); transition:color .3s ease,transform .3s ease}
.tbtn:hover{color:var(--ink)}
html.dark .tbtn svg{transform:rotate(180deg)}

main.wrap{position:relative; z-index:1}

/* ---------- shared bits ---------- */
.eyebrow{font-family:var(--mono); font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.16em; color:var(--ink-45)}
.hand{font-family:var(--hand); color:var(--ink-45)}
.squig{position:absolute; left:0; bottom:-9px; width:100%; height:8px; color:var(--ink-45); overflow:visible}
h1,h2,h3{font-family:var(--display); font-weight:400; text-transform:uppercase; letter-spacing:.01em; line-height:1.02; margin:0}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{font-family:var(--mono); font-size:10.5px; line-height:1; text-transform:lowercase; color:var(--ink-70);
  border:1px solid var(--ink-20); border-radius:4px; padding:5px 8px; white-space:nowrap}

/* ---------- landing ---------- */
.hero{padding:52px 0 26px}
.hero h1{position:relative; display:inline-block; font-size:clamp(40px,7vw,74px); margin:.12em 0 .28em}
.hero .bio{color:var(--ink-60); font-size:clamp(13px,1.7vw,15px); max-width:58ch; margin:0}
.owner-links{display:flex; gap:9px; flex-wrap:wrap; margin-top:22px}
.owner-links a{font-family:var(--mono); font-size:12px; color:var(--ink-60); text-decoration:none; border:1px solid var(--ink-20); padding:7px 13px; border-radius:999px; transition:color .18s ease,border-color .18s ease}
.owner-links a:hover{color:var(--ink); border-color:var(--ink-45)}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; padding:20px 0 60px}
.card{position:relative; display:block; width:100%; text-align:left; cursor:pointer; color:inherit; font:inherit;
  border:1px solid var(--ink-12); background:var(--paper); border-radius:7px; overflow:hidden; padding:0;
  transition:transform .18s ease,border-color .18s ease}
.card:hover{transform:translateY(-3px); border-color:var(--ink-30)}
.card.featured{grid-column:span 2}
@media(max-width:700px){ .card.featured{grid-column:span 1} }
.idx{position:absolute; top:8px; left:11px; z-index:2; font-family:var(--hand); font-size:19px; color:var(--paper);
  text-shadow:0 1px 3px rgba(0,0,0,.55); mix-blend-mode:normal}
.thumb{aspect-ratio:16/9; background:var(--ink-06); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; border-bottom:1px solid var(--ink-12)}
.thumb img,.thumb video{width:100%; height:100%; object-fit:cover; display:block}
.thumb .ph{font-family:var(--display); font-size:30px; color:var(--ink-20)}
.thumb .live{position:absolute; right:10px; bottom:10px; font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:lowercase;
  color:#fff; background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.3); padding:3px 8px; border-radius:999px; opacity:0; transition:opacity .15s}
.card:hover .live{opacity:1}
.card-body{padding:15px 16px 17px}
.card-body h3{position:relative; display:inline-block; font-size:20px; margin:0 0 7px}
.card.featured .card-body h3{font-size:25px}
.card:hover .card-body h3 .squig{color:var(--ink-70)}
.card-body .tl{color:var(--ink-60); font-size:12.5px; margin:0 0 12px; line-height:1.55}
.rowmeta{display:flex; gap:7px; align-items:center; margin-top:12px; color:var(--ink-45); font-size:11px}
.rowmeta .st{text-transform:capitalize}
.dot{width:5px; height:5px; border-radius:50%; background:var(--ink-45)}

/* ---------- detail ---------- */
.detail{padding:22px 0 80px; animation:fade .28s ease}
@keyframes fade{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
.back{background:none; border:0; color:var(--ink-45); cursor:pointer; font-family:var(--mono); font-size:12.5px; padding:6px 0; margin-bottom:14px; transition:color .18s ease}
.back:hover{color:var(--ink)}
.herobanner{aspect-ratio:16/9; border:1px solid var(--ink-20); border-radius:10px; overflow:hidden; margin:0 0 26px; background:var(--ink-06)}
.herobanner video,.herobanner img{width:100%; height:100%; object-fit:cover; display:block}
.dhead h1{position:relative; display:inline-block; font-size:clamp(34px,5vw,54px); margin:.14em 0 .2em}
.dhead .tl{color:var(--ink-60); font-size:16px; margin:0 0 16px; max-width:64ch; line-height:1.55}
.badges{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 16px}
.madewith{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:12px; color:var(--ink-60);
  border:1px solid var(--ink-20); background:var(--ink-06); padding:6px 12px; border-radius:999px}
.madewith b{color:var(--ink); font-weight:600}
.dlinks{display:flex; gap:9px; flex-wrap:wrap; margin:2px 0 24px}
.dlinks a{font-family:var(--mono); text-decoration:none; font-size:12.5px; padding:9px 15px; border-radius:8px; border:1px solid var(--ink-20); color:var(--ink-70); transition:border-color .18s ease,color .18s ease}
.dlinks a:hover{border-color:var(--ink-45); color:var(--ink)}
.dlinks a.primary{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.dlinks a.primary:hover{color:var(--paper)}
.note{border:1px solid var(--ink-12); background:var(--ink-06); border-radius:9px; padding:15px 18px; margin:0 0 30px; font-size:13.5px; color:var(--ink-70)}
.note p{margin:0 0 8px} .note p:last-child{margin:0}

.g-head{position:relative; font-family:var(--display); font-size:18px; text-transform:uppercase; letter-spacing:.02em; margin:36px 0 15px; display:flex; align-items:center; gap:12px; color:var(--ink)}
.g-head::after{content:""; flex:1; height:1px; background:var(--ink-12)}
.gallery{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:16px}
figure{margin:0}
figcaption{color:var(--ink-45); font-size:11.5px; margin-top:8px; line-height:1.5}
.gallery video.vid{width:100%; aspect-ratio:16/10; border:1px solid var(--ink-20); border-radius:9px; background:var(--ink-06); display:block; object-fit:cover}
.shot{aspect-ratio:16/10; border:1px solid var(--ink-20); border-radius:9px; overflow:hidden; background:var(--ink-06); display:flex; align-items:flex-end; position:relative}
.shot.has{cursor:zoom-in}
.shot img{width:100%; height:100%; object-fit:cover; display:block}
.shot .cap{position:relative; z-index:1; padding:10px 12px; font-size:11.5px; color:var(--ink-45)}
.shot.has .cap{display:none}

.cols{display:grid; grid-template-columns:1fr; gap:34px; margin-top:38px}
@media(min-width:840px){ .cols{grid-template-columns:1.55fr .95fr} }
.sec{margin-bottom:30px}
.sec h2{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--ink-45); margin:0 0 11px; font-weight:600}
.sec p{margin:0 0 11px; color:var(--ink-70)}
.hl{list-style:none; padding:0; margin:0; display:grid; gap:11px}
.hl li{padding-left:22px; position:relative; color:var(--ink-70)}
.hl li::before{content:"\2192"; position:absolute; left:0; color:var(--ink-45)}
.metrics{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:11px}
.metric{border:1px solid var(--ink-12); background:var(--ink-06); border-radius:9px; padding:13px 13px 11px}
.metric .v{font-family:var(--display); font-size:24px; letter-spacing:.01em; color:var(--ink)}
.metric .l{font-size:10.5px; color:var(--ink-45); margin-top:4px; line-height:1.35}

/* ---------- lightbox ---------- */
.lb{position:fixed; inset:0; background:rgba(8,7,6,.9); display:none; align-items:center; justify-content:center; z-index:50; padding:30px; cursor:zoom-out; flex-direction:column; gap:12px}
.lb.open{display:flex}
.lb img{max-width:100%; max-height:86vh; border-radius:8px}
.lb .lbcap{color:#e8e6dd; font-family:var(--mono); font-size:12.5px; max-width:80ch; text-align:center}

/* ---------- footer ---------- */
footer{position:relative; z-index:1; border-top:1px solid var(--ink-12); margin-top:24px}
footer .wrap{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 24px; padding:22px 20px; color:var(--ink-45); font-size:11px}
@media(min-width:768px){ footer .wrap{padding:22px 40px} }
footer .fh{font-family:var(--hand); font-size:15px; color:var(--ink-35); transform:rotate(-2deg)}
footer a{text-decoration:none; transition:color .18s ease}
footer a:hover{color:var(--ink)}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important; transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>

<main id="app" class="wrap"></main>
<div class="lb" id="lb"><img alt=""><div class="lbcap" id="lbcap"></div></div>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const OWNER = DATA.owner || {};
const PROJECTS = (DATA.projects || []).slice().sort((a,b) =>
  (b.featured?1:0)-(a.featured?1:0) || (b.year||0)-(a.year||0));
document.getElementById('brandName').textContent = OWNER.name || 'portfolio';
const bySlug = Object.fromEntries(PROJECTS.map(p => [p.slug, p]));
const SQUIG = '<svg class="squig" viewBox="0 0 120 9" preserveAspectRatio="none" aria-hidden="true"><path d="M2 6C18 2 34 8 52 5C70 2 88 8 118 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

// spiral binding holes
document.getElementById('binding').innerHTML = Array.from({length:40},()=>'<span></span>').join('');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function chips(a){return (a||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join('');}
function isVid(m){return !!m && (m.type==='video' || /\.(webm|mp4|mov|m4v)$/i.test(m.src||''));}
function heroMedia(p){return (p.media||[]).find(x=>x.role==='hero')||(p.media||[])[0];}
function posterOf(m){if(!m)return '';return m.type==='image'?(m.src||''):(m.poster||'');}
function mdish(t){
  return String(t||'').split(/\n{2,}/).map(b=>b.trim()).filter(Boolean).map(b=>{
    if(/^[-*] /m.test(b)){
      const items=b.split(/\n(?=[-*] )/).map(l=>l.replace(/^[-*] /,'').trim()).filter(Boolean);
      return '<ul class="hl">'+items.map(i=>`<li>${esc(i)}</li>`).join('')+'</ul>';
    }
    return `<p>${esc(b)}</p>`;
  }).join('');
}

function landing(){
  const cards = PROJECTS.map((p,i)=>{
    const hm=heroMedia(p); const poster=posterOf(hm)||((p.media||[]).find(x=>x&&x.type==='image'&&x.src)||{}).src||'';
    const vid=isVid(hm)&&hm.src?esc(hm.src):'';
    const inner=poster?`<img src="${esc(poster)}" alt="${esc((hm&&hm.caption)||p.name)}" onerror="this.remove()">`:`<span class="ph">&#9670;</span>`;
    const num=String(i+1).padStart(2,'0');
    return `
    <button class="card ${p.featured?'featured':''}" data-vid="${vid}" onclick="location.hash='#/p/${esc(p.slug)}'">
      <span class="idx">${num}</span>
      <div class="thumb">${inner}${vid?'<span class="live">&#9654; preview</span>':''}</div>
      <div class="card-body">
        <h3>${esc(p.name)}${SQUIG}</h3>
        <p class="tl">${esc(p.tagline||'')}</p>
        <div class="chips">${chips((p.tech||[]).slice(0,5))}</div>
        <div class="rowmeta"><span class="dot"></span><span class="st">${esc(p.status||'')}</span>${p.year?'<span>&middot; '+p.year+'</span>':''}${p.made_with?'<span>&middot; made with '+esc(p.made_with)+'</span>':''}</div>
      </div>
    </button>`;}).join('');
  return `<section class="hero">
      <div class="eyebrow">${esc(OWNER.role||'selected work')}</div>
      <h1>${esc(OWNER.name||'my projects')}${SQUIG}</h1>
      <p class="bio">${esc(OWNER.bio||'')}</p>
      ${(OWNER.links&&OWNER.links.length)?`<div class="owner-links">${OWNER.links.map(l=>`<a href="${esc(l.url)}">${esc(l.label)}</a>`).join('')}</div>`:''}
    </section>
    <section class="grid">${cards||'<p>no projects yet.</p>'}</section>`;
}

function galleryHTML(items){
  return items.map(m=>{
    if(isVid(m)) return `<figure><video class="vid" src="${esc(m.src)}" ${m.poster?`poster="${esc(m.poster)}"`:''} controls muted loop playsinline preload="metadata"></video>${m.caption?`<figcaption>${esc(m.caption)}</figcaption>`:''}</figure>`;
    const has=!!m.src;
    const img=has?`<img src="${esc(m.src)}" alt="${esc(m.caption||'')}" onerror="this.parentNode.classList.remove('has');this.remove()">`:'';
    const cap=m.caption?`<span class="cap">${esc(m.caption)}</span>`:'';
    return `<figure><div class="shot ${has?'has':''}" data-full="${esc(m.src||'')}" data-cap="${esc(m.caption||'')}">${img}${cap}</div>${has&&m.caption?`<figcaption>${esc(m.caption)}</figcaption>`:''}</figure>`;
  }).join('');
}

function detail(p){
  const hm=heroMedia(p);
  let banner='';
  if(hm){
    if(isVid(hm)) banner=`<div class="herobanner"><video src="${esc(hm.src)}" ${hm.poster?`poster="${esc(hm.poster)}"`:''} controls muted loop playsinline preload="metadata"></video></div>`;
    else if(hm.src) banner=`<div class="herobanner"><img src="${esc(hm.src)}" alt="${esc(hm.caption||p.name)}"></div>`;
  }
  const rest=(p.media||[]).filter(m=>m!==hm);
  const groups=[];                                  // keep first-seen order
  rest.forEach(m=>{ const g=m.group||'Walkthrough';
    let e=groups.find(x=>x.name===g); if(!e){e={name:g,items:[]}; groups.push(e);} e.items.push(m); });
  const galleries=groups.map(g=>`<div class="g-head">${esc(g.name)}</div><div class="gallery">${galleryHTML(g.items)}</div>`).join('');
  const links=(p.links||[]).filter(l=>l.url).map((l,i)=>`<a class="${i===0?'primary':''}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||l.kind||'Link')}</a>`).join('');
  const metrics=(p.metrics||[]).map(m=>`<div class="metric"><div class="v">${esc(m.value)}</div><div class="l">${esc(m.label)}</div></div>`).join('');
  const sections=(p.sections||[]).map(s=>`<div class="sec"><h2>${esc(s.heading)}</h2>${mdish(s.body)}</div>`).join('');
  const highlights=(p.highlights&&p.highlights.length)?`<div class="sec"><h2>Highlights</h2><ul class="hl">${p.highlights.map(h=>`<li>${esc(h)}</li>`).join('')}</ul></div>`:'';
  return `<article class="detail">
    <nav style="display:flex;flex-wrap:wrap;gap:20px" aria-label="Back navigation"><a class="back" href="/projects/${encodeURIComponent(p.slug)}">&#8592; back to project</a><a class="back" href="/projects">all projects</a></nav>
    ${banner}
    <div class="dhead">
      <div class="eyebrow">${esc(p.status||'')}${p.year?' &middot; '+p.year:''}${p.role?' &middot; '+esc(p.role):''}</div>
      <h1>${esc(p.name)}${SQUIG}</h1>
      <p class="tl">${esc(p.tagline||'')}</p>
    </div>
    <div class="badges">${p.made_with?`<span class="madewith">made with <b>${esc(p.made_with)}</b></span>`:''}</div>
    ${links?`<div class="dlinks">${links}</div>`:''}
    ${p.note?`<div class="note">${mdish(p.note)}</div>`:''}
    ${galleries}
    <div class="cols">
      <div>
        ${p.summary?`<div class="sec"><h2>Overview</h2>${mdish(p.summary)}</div>`:''}
        ${p.problem?`<div class="sec"><h2>The problem</h2>${mdish(p.problem)}</div>`:''}
        ${sections}
      </div>
      <aside>
        ${highlights}
        ${(p.tech&&p.tech.length)?`<div class="sec"><h2>Built with</h2><div class="chips">${chips(p.tech)}</div></div>`:''}
        ${metrics?`<div class="sec"><h2>By the numbers</h2><div class="metrics">${metrics}</div></div>`:''}
      </aside>
    </div>
  </article>`;
}

function render(){
  const app=document.getElementById('app');
  const m=(location.hash||'#/').match(/^#\/p\/(.+)$/);
  if(m && bySlug[decodeURIComponent(m[1])]){ app.innerHTML=detail(bySlug[decodeURIComponent(m[1])]); wireShots(); }
  else { app.innerHTML=landing(); wireHover(); }
  window.scrollTo(0,0);
}
function wireShots(){
  document.querySelectorAll('.shot.has').forEach(s=>{
    const full=s.getAttribute('data-full'); if(!full) return;
    s.addEventListener('click',()=>{
      const lb=document.getElementById('lb');
      lb.querySelector('img').src=full;
      document.getElementById('lbcap').textContent=s.getAttribute('data-cap')||'';
      lb.classList.add('open');
    });
  });
}
function wireHover(){                                 // featured delight: hover plays the hero clip
  document.querySelectorAll('.card[data-vid]').forEach(c=>{
    const src=c.getAttribute('data-vid'); if(!src) return;
    const thumb=c.querySelector('.thumb'); let v=null;
    c.addEventListener('mouseenter',()=>{
      if(v) return;
      v=document.createElement('video');
      Object.assign(v,{src,muted:true,loop:true,playsInline:true,autoplay:true});
      v.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover';
      thumb.appendChild(v);
    });
    c.addEventListener('mouseleave',()=>{ if(v){v.remove(); v=null;} });
  });
}
document.getElementById('lb').addEventListener('click',e=>e.currentTarget.classList.remove('open'));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') document.getElementById('lb').classList.remove('open'); });

// theme toggle — shares localStorage.theme + the .dark class with the main portfolio
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=!document.documentElement.classList.contains('dark');
  document.documentElement.classList.toggle('dark',dark);
  try{ localStorage.setItem('theme',dark?'dark':'light'); }catch(e){}
});

document.getElementById('foot').innerHTML=`<span>&copy; ${new Date().getFullYear()} ${esc(OWNER.name||'')}</span><span class="fh">built with grid paper &amp; showcase-kit :)</span><a href="#/">&#8593; top</a>`;
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
